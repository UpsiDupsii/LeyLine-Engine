[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leyline-engine"
version = "0.1.0"
description = "Autonomous AI Game Player & Real-time Live Commentator Engine powered by Multimodal Gemini"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "UpsiDupsii" }
]
dependencies = [
    "google-genai>=1.0.0",
    "mss>=9.0.1",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "pynput>=1.7.6",
    "edge-tts>=6.1.12",
    "pygame-ce>=2.5.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
